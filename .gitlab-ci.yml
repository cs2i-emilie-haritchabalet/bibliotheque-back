variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  TRIVY_VERSION: "0.69.3"

cache:
  paths:
    - .m2/repository/

stages:
  - build
  - test
  - security
  - image

# ─────────────────────────────────────────────
# BUILD + TESTS
# ─────────────────────────────────────────────

build-test:
  stage: build
  image: maven:3.9-eclipse-temurin-17

  services:
    - name: postgres:16
      alias: postgres
      variables:
        POSTGRES_DB: bibliotheque
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres

  variables:
    SPRING_PROFILES_ACTIVE: test
    SPRING_MAIL_HOST: localhost
    SPRING_MAIL_PORT: 1025

  script:
    - chmod +x mvnw
    - mvn clean verify

  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/

# ─────────────────────────────────────────────
# SECURITY (SAST + SCA)
# ─────────────────────────────────────────────

semgrep-sast:
  stage: security
  image: semgrep/semgrep

  script:
    - semgrep ci --config=auto --json --output=semgrep-report.json

  allow_failure: true

  artifacts:
    when: always
    paths:
      - semgrep-report.json


dependency-check:
  stage: security
  image: maven:3.9-eclipse-temurin-17

  script:
    - mvn org.owasp:dependency-check-maven:11.1.1:check -DfailBuildOnCVSS=7 -Dformats=HTML,JSON

  allow_failure: true

  artifacts:
    when: always
    paths:
      - target/dependency-check-report.*

# ─────────────────────────────────────────────
# BUILD DOCKER IMAGE
# ─────────────────────────────────────────────

docker-build:
  needs:
    - build-test
  stage: image
  image: docker:latest
  services:
    - docker:dind

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin

  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest

  after_script:
    - docker logout

  only:
    - main
    - develop

# ─────────────────────────────────────────────
# CONTAINER SECURITY (TRIVY)
# ─────────────────────────────────────────────

trivy-scan:
  stage: image
  image: docker:latest
  services:
    - docker:dind

  needs:
    - docker-build

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin

  script:
    - |
      docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -e TRIVY_USERNAME=$CI_REGISTRY_USER \
        -e TRIVY_PASSWORD=$CI_REGISTRY_PASSWORD \
        aquasec/trivy:${TRIVY_VERSION} \
        image --no-progress \
        --severity HIGH,CRITICAL \
        --exit-code 1 \
        $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

  after_script:
    - docker logout

  only:
    - main
    - develop
