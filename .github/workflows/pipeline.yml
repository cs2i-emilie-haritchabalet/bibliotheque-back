name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  security:
    needs: quality
    uses: ./.github/workflows/security.yml

  sbom:
    needs: security
    uses: ./.github/workflows/sbom.yml

  docs:
    needs: sbom
    uses: ./.github/workflows/docs.yml
