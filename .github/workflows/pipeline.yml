# Workflow principal
name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    secrets: inherit

  security:
    needs: quality
    uses: ./.github/workflows/security.yml

  sbom:
    needs: security
    uses: ./.github/workflows/sbom.yml

  docs:
    uses: ./.github/workflows/docs.yml
#commentaire pour déclancher pipeline
